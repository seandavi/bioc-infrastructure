<!-- legend -->
<rect x="20" y="660" width="1240" height="140" rx="6" class="eco-leg eco-box"/>
<text x="32" y="682" class="eco-h">Legend</text>
<rect x="32" y="694" width="22" height="14" class="eco-dom eco-box"/><text x="62" y="706" class="eco-t">domain name</text>
<rect x="190" y="694" width="22" height="14" class="eco-wk eco-box"/><text x="220" y="706" class="eco-t">Cloudflare Worker</text>
<rect x="360" y="694" width="22" height="14" class="eco-bk eco-box"/><text x="390" y="706" class="eco-t">bucket / data store</text>
<rect x="540" y="694" width="22" height="14" class="eco-job eco-box"/><text x="570" y="706" class="eco-t">job / CI</text>
<rect x="670" y="694" width="22" height="14" class="eco-ext eco-box"/><text x="700" y="706" class="eco-t">legacy or external</text>
<path class="eco-l" d="M860 701 H900"/><text x="908" y="706" class="eco-t">request / write</text>
<path class="eco-l eco-d" d="M1030 701 H1070"/><text x="1078" y="706" class="eco-t">read / background</text>
<text x="32" y="734" class="eco-s">Arrows: Worker → GCS is Logpush; sync and CI write R2. Serving: browser → domain → bioc-site Worker → R2 bioc-site (build first, else mirror). Not drawn: master → sync, r-universe and upstream repo → CI, GCS → bioc-traffic.</text>
<text x="32" y="752" class="eco-s">Logs: Worker → Logpush → GCS bioc-u24-logs → bioc-traffic. Registry (Worker + R2 bioc-prop) observes r-universe and is not in the bioconductor.org path yet.</text>
<text x="32" y="770" class="eco-s">Other bioconductor.org subdomains (git., support., code., etc.) are copied into the Cloudflare zone from Route53 and are not drawn. Sources: how-it-works.qmd, cloudflare-account-migration.qmd, ADR 0003, r2-migration.qmd.</text>
<text x="32" y="788" class="eco-s">Checked against repo docs 2026-10-16, not against the live Cloudflare account.</text>
</svg>
