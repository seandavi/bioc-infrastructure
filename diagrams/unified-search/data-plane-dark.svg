<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 660" width="1430" height="660" role="img" aria-label="The logical data plane. Four sources feed four producers, each owning one slice: bioc-registry for package facts, bioc-traffic for usage, bioc-intelligence for interpretation, bioc-contrib-intelligence for submissions. They publish open, versioned Parquet and JSON joined on the package, which search, analytics, integration and agents all read.">
<title>The logical data plane. Four sources feed four producers, each owning one slice: bioc-registry for package facts, bioc-traffic for usage, bioc-intelligence for interpretation, bioc-contrib-intelligence for submissions. They publish open, versioned Parquet and JSON joined on the package, which search, analytics, integration and agents all read.</title>
