<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 510" width="1370" height="510" role="img" aria-label="Agents in the loop. Events from the data plane (a version propagates, a build breaks, a submission is reviewed, zero-result searches spike, a person asks a question) reach an agent that reads the same data people see and cites stable URLs. It produces answers with citations, draft maintainer notes, draft issues or pull requests, and review precedent. Anything that changes the project passes human review.">
<title>Agents in the loop. Events from the data plane (a version propagates, a build breaks, a submission is reviewed, zero-result searches spike, a person asks a question) reach an agent that reads the same data people see and cites stable URLs. It produces answers with citations, draft maintainer notes, draft issues or pull requests, and review precedent. Anything that changes the project passes human review.</title>
