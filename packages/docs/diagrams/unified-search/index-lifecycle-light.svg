<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 470" width="1490" height="470" role="img" aria-label="Index lifecycle. A registry propagation is the event. CI rebuilds the website (pages, Pagefind shards, sitemap, JSON-LD) and the package finder&#x27;s Parquet, and bioc-intelligence refreshes its marts. Everything lands as immutable files on R2, served by the edge; rolling back means moving a pointer. Every index can be rebuilt from the source of truth.">
<title>Index lifecycle. A registry propagation is the event. CI rebuilds the website (pages, Pagefind shards, sitemap, JSON-LD) and the package finder&#x27;s Parquet, and bioc-intelligence refreshes its marts. Everything lands as immutable files on R2, served by the edge; rolling back means moving a pointer. Every index can be rebuilt from the source of truth.</title>
<defs><marker id="ah-MUTED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a6c"/></marker><marker id="ah-BLUE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7fc4"/></marker><marker id="ah-GREEN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f8f17"/></marker><marker id="ah-AMBER" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b87a00"/></marker><marker id="ah-CORAL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cc4733"/></marker><marker id="ah-VIOLET" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e4fd0"/></marker></defs>
<rect x="30" y="150" width="280" height="120" rx="12" fill="#4f8f171a" stroke="#4f8f17" stroke-width="2"/>
<text x="46" y="180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Registry propagates</text>
<text x="46" y="210" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">a package version</text>
<text x="46" y="232" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">passes the gate</text>
<rect x="380" y="150" width="260" height="120" rx="12" fill="#6e4fd01a" stroke="#6e4fd0" stroke-width="2"/>
<text x="396" y="180" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Change event</text>
<text x="396" y="210" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">index.json changes;</text>
<text x="396" y="232" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">consumers key off it</text>
<path d="M310,210 L375,210" fill="none" stroke="#4f8f17" stroke-width="2.2" marker-end="url(#ah-GREEN)"/>
<rect x="720" y="30" width="320" height="110" rx="12" fill="#1f7fc41a" stroke="#1f7fc4" stroke-width="2"/>
<text x="736" y="60" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Website build (CI)</text>
<text x="736" y="90" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">pages, Pagefind shards,</text>
<text x="736" y="112" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">sitemap, JSON-LD</text>
<path d="M640,210 L715,85" fill="none" stroke="#6e4fd0" stroke-width="2.2" marker-end="url(#ah-VIOLET)"/>
<path d="M1040,85 L1115,210" fill="none" stroke="#4a5a6c" stroke-width="2.2" marker-end="url(#ah-MUTED)"/>
<rect x="720" y="160" width="320" height="110" rx="12" fill="#6e4fd01a" stroke="#6e4fd0" stroke-width="2"/>
<text x="736" y="190" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Finder index (CI)</text>
<text x="736" y="220" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">Parquet subset for</text>
<text x="736" y="242" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">the package finder</text>
<path d="M640,210 L715,215" fill="none" stroke="#6e4fd0" stroke-width="2.2" marker-end="url(#ah-VIOLET)"/>
<path d="M1040,215 L1115,210" fill="none" stroke="#4a5a6c" stroke-width="2.2" marker-end="url(#ah-MUTED)"/>
<rect x="720" y="290" width="320" height="110" rx="12" fill="#6e4fd01a" stroke="#6e4fd0" stroke-width="2"/>
<text x="736" y="320" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Intelligence refresh</text>
<text x="736" y="350" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">marts: people, funders,</text>
<text x="736" y="372" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">papers, impact</text>
<path d="M640,210 L715,345" fill="none" stroke="#6e4fd0" stroke-width="2.2" marker-end="url(#ah-VIOLET)"/>
<path d="M1040,345 L1115,210" fill="none" stroke="#4a5a6c" stroke-width="2.2" marker-end="url(#ah-MUTED)"/>
<rect x="1120" y="130" width="340" height="160" rx="12" fill="#1f7fc41a" stroke="#1f7fc4" stroke-width="2"/>
<text x="1136" y="160" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#14202e" font-weight="650" text-anchor="start" xml:space="preserve">Immutable files on R2</text>
<text x="1136" y="190" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">site/&lt;sha&gt;/, data/&lt;date&gt;/</text>
<text x="1136" y="212" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">served by the edge</text>
<text x="1136" y="234" font-family="'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#4a5a6c" font-weight="400" text-anchor="start" xml:space="preserve">rollback = move a pointer</text>
<text x="745" y="440" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#4a5a6c" font-weight="500" text-anchor="middle" xml:space="preserve">Every index is derived and disposable: delete it and rebuild it from the source of truth.</text>
</svg>
