project:
  type: website
  output-dir: _site
  # Replaces the generated llms.txt with the hand-written one; builds llms-full.txt.
  post-render: ./llms-post-render.sh
  # This repo is public, so there is no render-list boundary to maintain:
  # everything here is published, including the ADRs. See adr/0001.
  render:
    - "*.qmd"
    - "adr/*.md"
  # Served for mirror operators to download (mirror-how-to.qmd).
  resources:
    - mirror-sync.sh
    # Unlinked architecture diagram (archify 3.0.1); regenerate from diagrams/architecture.json.
    - diagrams/architecture.html

website:
  site-url: "https://seandavi.github.io/bioc-infrastructure/"
  llms-txt: true
  title: "Bioconductor Infrastructure"
  google-analytics: "G-29EGVRD25B"
  description: "How bioconductor.org is built, served, and being replaced — and the decisions behind it"
  repo-url: https://github.com/seandavi/bioc-infrastructure
  repo-branch: main
  repo-actions: [edit, source]
  navbar:
    right:
      - icon: github
        href: https://github.com/seandavi/bioc-infrastructure
        aria-label: GitHub repository
    left:
      - href: index.qmd
        text: Overview
      - href: roadmap.qmd
        text: Roadmap
      - href: install.qmd
        text: Installing Packages
      - href: report.qmd
        text: Report a Problem
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Overview
      - section: Using
        contents:
          - href: install.qmd
            text: Installing Packages
          - href: report.qmd
            text: Reporting a Problem
          - href: mirror-how-to.qmd
            text: Running a Mirror
      - section: How it works
        contents:
          - href: how-it-works.qmd
            text: How bioconductor.org Works
          - href: cache.qmd
            text: Edge Cache
          - href: astro-site-build.qmd
            text: Astro Site Build
          - href: propagation-gate.qmd
            text: Propagation Gate
      - section: Operating
        contents:
          - href: operations.qmd
            text: Operations &amp; Runbooks
          - href: ci.qmd
            text: CI &amp; Scheduled Jobs
      - section: Plans
        contents:
          - href: roadmap.qmd
            text: Roadmap
          - href: registry-switch.qmd
            text: Registry Switch (plan)
          - href: cloudflare-account-migration.qmd
            text: Cloudflare Account Migration
      - section: Records
        contents:
          - href: improvements.qmd
            text: What the New Site Has Changed
          - href: traffic-2026-09-30.qmd
            text: One Day of Traffic (2026-09-30)
          - href: dns-cutover.qmd
            text: DNS Inventory &amp; Cutover
          - href: r-universe-size-limits.qmd
            text: r-universe Size Limits
          - href: data-packages-in-r-universe.qmd
            text: Data Packages in r-universe
          - href: current-state.qmd
            text: Current State (legacy)
          - href: legacy-propagation.qmd
            text: Legacy Propagation & Push Hooks
          - href: builder-transition.qmd
            text: Builder Transition
          - href: views-and-r-universe.qmd
            text: VIEWS &amp; r-universe
          - href: reproducing-package-pages.qmd
            text: Package Pages
          - href: download-stats.qmd
            text: Download Stats
          - href: r2-migration.qmd
            text: R2 Migration
          - href: decommission-plan.qmd
            text: Decommission Plan
      - section: Decisions (ADRs)
        contents:
          - auto: "adr/*.md"

format:
  html:
    # Archify-derived theme on top of Bootstrap: palette, fonts, panels, cards.
    theme:
      light: [cosmo, theme/archify.scss, theme/archify-light.scss]
      dark: [cosmo, theme/archify.scss, theme/archify-dark.scss]
    # Follow the reader's OS light/dark preference until they use the toggle.
    respect-user-color-scheme: true
    grid:
      sidebar-width: 270px
      body-width: 860px
      margin-width: 240px
      gutter-width: 2rem
    toc: true
    number-sections: false
    mermaid:
      theme: neutral
    include-after-body: zoom.html
