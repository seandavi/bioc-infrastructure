name: Package install problem
description: BiocManager or install.packages fails to find, download or install a Bioconductor package
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the *repository* seems wrong: a package can't be found, a download fails, a binary is missing, or versions don't match.
        If the package installs but its own code fails, report it to the package's maintainer (the "BugReports" link on its landing page) or ask on [support.bioconductor.org](https://support.bioconductor.org).
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: r
      placeholder: BiocManager::install("limma")
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Everything R printed, including warnings.
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Your setup
      description: Paste the output of these commands.
      render: text
      value: |
        # BiocManager::version()

        # BiocManager::repositories()

        # sessionInfo()
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you installing from?
      options:
        - bioconductor.org directly (the default)
        - A mirror
        - A company or institutional proxy
        - Not sure
