name: registry / test
on:
  push:
    paths: ['packages/registry/**', '.github/workflows/registry-*.yml']
    branches: [main]
  pull_request:
    paths: ['packages/registry/**', '.github/workflows/registry-*.yml']
defaults:
  run:
    working-directory: packages/registry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/registry/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script scripts/package_changes.py --selftest
      # Worker deploys stay manual (wrangler deploy) until the repo settles
      # into its public home; type noise from workers-types is pre-existing,
      # so gate on src/ diagnostics only.
      - run: npx tsc -p . --noEmit 2>&1 | grep -E '^src/' && exit 1 || exit 0
